<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explainly Settings</title>
  </head>
  <body>
    <h1>Explainly Settings</h1>
    <label for="persona">Persona</label>
    <select id="persona">
      <option value="General" selected>General (plain language)</option>
      <option value="Staff Software Engineer">Staff Software Engineer</option>
      <option value="Experienced Financial Analyst">Experienced Financial Analyst</option>
      <option value="Senior Data Scientist">Senior Data Scientist</option>
      <option value="University Professor">University Professor</option>
      <option value="Medical Doctor">Medical Doctor</option>
    </select>
    <label for="environment">Environment</label>
    <select id="environment">
      <option value="dev">dev</option>
      <option value="staging">staging</option>
      <option value="prod">prod</option>
    </select>
    <label for="explainerEnabled">Explainer Enabled</label>
    <input id="explainerEnabled" type="checkbox" checked />
    <button id="saveBtn">Save</button>
    <script src="./options.js"></script>
  </body>
</html>
